<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOTIP Drive (MTProto Edition)</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#132e53">
  <link rel="icon" type="image/png" href="./sotip-drive.png">
  <link rel="apple-touch-icon" href="./sotip-drive.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root, body[data-theme="basic"] {
      --sidebar-width: 265px; --bg-body: #f4f6f9; --bg-panel: #ffffff; --bg-sidebar: #132e53; --bg-topbar: #ffffff;
      --text-sidebar: #ffffff; --text-topbar: #0f172a; --primary: #1e56a0; --accent-gold: #eab308;
      --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --hover-bg: #f1f5f9;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; }
    
    /* កំណត់ Font ភាសាអង់គ្លេស Times New Roman និង ខ្មែរ */
    body, input, button, select, textarea {
      margin: 0; padding: 0; background-color: var(--bg-body); color: var(--text-main);
      font-family: 'Times New Roman', 'Khmer OS Siemreap', 'Battambang', 'Kantumruy Pro', sans-serif !important;
    }
    body { height: 100vh; height: 100dvh; display: flex; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); color: var(--text-sidebar); display: flex; flex-direction: column; padding: 22px 16px; z-index: 1050; flex-shrink: 0; }
    .logo-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .logo-icon { width: 42px; height: 42px; background: rgba(255,255,255,0.15); color: var(--accent-gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .logo-text h2 { margin: 0; font-size: 1.2rem; font-weight: 700; color: #fff; }
    .logo-text p { margin: 0; font-size: 0.72rem; color: rgba(255,255,255,0.75); font-family: 'Times New Roman', sans-serif; }

    .nav-menu { list-style: none; padding: 0; margin: 0; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; color: rgba(255,255,255,0.85); font-weight: 500; margin-bottom: 6px; cursor: pointer; transition: all 0.2s; font-family: 'Khmer OS Siemreap', sans-serif; }
    .nav-item:hover { background-color: rgba(255,255,255,0.12); color: #fff; }
    .nav-item.active { background-color: rgba(255,255,255,0.2); color: #fff; font-weight: 600; border-left: 4px solid var(--accent-gold); }

    .storage-area { background-color: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 14px; margin-top: auto; color: #fff; }

    /* Main Content */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; width: 100%; }
    .topbar { height: 68px; background: var(--bg-topbar); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 12px; }
    .search-bar { display: flex; align-items: center; background-color: rgba(150,150,150,0.12); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; flex: 1; max-width: 460px; }
    .search-bar input { border: none; outline: none; background: transparent; width: 100%; color: var(--text-topbar); margin-left: 10px; }
    .view-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background-color: var(--bg-panel); border-radius: 10px; color: var(--text-main); cursor: pointer; }
    .view-btn.active { background-color: var(--primary); color: #fff; border-color: var(--primary); }

    .action-bar { padding: 16px 24px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn-action { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 0.88rem; cursor: pointer; background-color: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); box-shadow: var(--card-shadow); font-family: 'Khmer OS Siemreap', sans-serif; }
    .btn-action input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .content-scroll { flex: 1; overflow-y: auto; padding: 0 24px 40px; }
    
    /* -------------------------------------------------------------
       រចនាបថកាតឯកសារ (បានដក overflow: hidden ចេញ)
       ------------------------------------------------------------- */
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
    
    .file-card { 
      background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; 
      padding: 12px; text-align: center; position: relative; transition: all 0.2s; 
      box-shadow: var(--card-shadow); display: flex; flex-direction: column; 
      /* កំណត់ overflow ឱ្យអាចលោត Menu ចេញក្រៅបាន */
      overflow: visible !important; 
      z-index: 1; 
    }
    .file-card:hover { border-color: var(--primary); transform: translateY(-2px); z-index: 10; }
    .file-card.has-menu-open { z-index: 9999 !important; border-color: var(--primary); }
    
    /* -------------------------------------------------------------
       រចនាបថ 3-dots Menu (ទីតាំង និង Z-Index ថ្មី)
       ------------------------------------------------------------- */
    .card-menu { position: absolute; top: 10px; right: 10px; z-index: 50; }
    .btn-dots { width: 32px; height: 32px; border-radius: 8px; border: none; background: rgba(255,255,255,0.9); color: #475569; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: all 0.2s; }
    .btn-dots:hover { background: var(--bg-body); color: var(--primary); }
    
    .custom-menu { 
      display: none; position: absolute; top: 100%; right: 0; margin-top: 5px; 
      width: 190px; background-color: var(--bg-panel); border: 1px solid var(--border); 
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 8px; 
      z-index: 10000; text-align: left; font-family: 'Khmer OS Siemreap', sans-serif;
    }
    .custom-menu.show { display: block; animation: menuFade 0.2s ease; }
    @keyframes menuFade { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    
    .custom-menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 0.9rem; font-weight: 500; color: var(--text-main); border-radius: 8px; cursor: pointer; user-select: none; transition: background 0.1s; }
    .custom-menu-item:hover { background-color: var(--hover-bg); }
    .custom-menu-divider { height: 1px; background-color: var(--border); margin: 4px 0; }

    /* -------------------------------------------------------------
       រចនាបថរូប Background គ្រប់ប្រភេទ File
       ------------------------------------------------------------- */
    .card-thumb-box {
      width: 100%; height: 130px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px; position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,0.05);
      cursor: pointer;
    }
    .card-thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
    .file-card:hover .card-thumb-box img { transform: scale(1.05); }

    .file-icon-fallback {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; transition: transform 0.3s;
    }
    .file-card:hover .file-icon-fallback { transform: scale(1.08); }

    .ext-badge { position: absolute; bottom: 6px; right: 6px; font-size: 0.65rem; font-weight: bold; padding: 3px 8px; border-radius: 6px; color: #fff; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.25); font-family: 'Times New Roman', sans-serif; letter-spacing: 0.5px; }
    
    .card-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; padding: 0 4px; line-height: 1.3; cursor: pointer; }
    .card-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: auto; font-family: 'Times New Roman', sans-serif; }

    /* Modals & UI Components */
    .custom-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(3px); z-index: 10500; display: none; align-items: center; justify-content: center; padding: 16px; }
    .custom-modal-overlay.active { display: flex; }
    .custom-modal-box { background-color: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 480px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
    .custom-modal-box.modal-xl-box { max-width: 960px; height: 90vh; display: flex; flex-direction: column; }
    
    .cm-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .cm-body { padding: 20px; font-family: 'Khmer OS Siemreap', sans-serif; }
    .cm-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background-color: var(--bg-body); color: var(--text-main); outline: none; font-family: 'Times New Roman', sans-serif; }
    
    #previewBody { background-color: #f1f5f9; flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; width: 100%; position: relative; }

    .toast-status { position: fixed; bottom: 20px; left: 20px; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 12px; display: flex; align-items: center; gap: 10px; z-index: 12000; transform: translateY(120px); opacity: 0; transition: all 0.3s; font-size: 0.9rem; font-family: 'Khmer OS Siemreap', sans-serif; }
    .toast-status.show { transform: translateY(0); opacity: 1; }
  </style>
  <script type="module" crossorigin src="./assets/index-DBEU7_El.js"></script>
</head>
<body data-theme="basic">

  <aside class="sidebar">
    <div class="logo-brand">
      <div class="logo-icon"><i class="bi bi-telegram"></i></div>
      <div class="logo-text">
        <h2 style="font-family:'Times New Roman', sans-serif;">SOTIP Drive</h2>
        <p>MTProto • Saved Messages</p>
      </div>
    </div>

    <ul class="nav-menu">
      <li class="nav-item active" onclick="filterByCategory('ALL', this)"><i class="bi bi-collection-fill"></i> ឯកសារទាំងអស់</li>
      <li class="nav-item" onclick="filterByCategory('DOCS', this)"><i class="bi bi-file-earmark-pdf-fill text-danger"></i> ឯកសារ & PDF</li>
      <li class="nav-item" onclick="filterByCategory('MEDIA', this)"><i class="bi bi-play-btn-fill text-info"></i> រូបភាព & វីដេអូ</li>
      <li class="nav-item" onclick="filterByCategory('ZIP', this)"><i class="bi bi-file-earmark-zip-fill text-warning"></i> បណ្ណសារ (ZIP)</li>
      <li class="nav-item" onclick="syncSavedMessages()"><i class="bi bi-arrow-repeat text-success"></i> Sync ពី Saved Messages</li>
      <li class="nav-item" id="navLoginBtn" onclick="openModal('authModal')"><i class="bi bi-key-fill text-warning"></i> ភ្ជាប់គណនី (Login)</li>
      <li class="nav-item text-danger" id="navLogoutBtn" style="display:none;" onclick="logoutMTProto()"><i class="bi bi-box-arrow-right"></i> ចាកចេញ (Log out)</li>
    </ul>

    <div class="storage-area">
      <div class="d-flex justify-content-between small fw-bold mb-1">
        <span id="accountStatusText" style="font-family:'Khmer OS Siemreap', sans-serif;">កំពុងពិនិត្យ...</span>
        <span id="totalStorageText" style="font-family:'Times New Roman', sans-serif;">0 B</span>
      </div>
      <div class="progress mb-2" style="height:6px; background:rgba(255,255,255,0.2);"><div class="progress-bar bg-warning" style="width:100%;"></div></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="search-bar">
        <i class="bi bi-search text-muted"></i>
        <input type="text" id="searchInput" placeholder="ស្វែងរកឯកសារក្នុង Saved Messages..." oninput="applySearchFilter()" style="font-family:'Khmer OS Siemreap', 'Times New Roman', sans-serif;">
      </div>
    </header>

    <div class="action-bar">
      <div class="btn-action">
        <i class="bi bi-cloud-arrow-up-fill text-primary"></i> Upload ឯកសារ
        <input type="file" id="fileUploadInput" multiple onchange="uploadFilesMTProto(this.files)">
      </div>
      <button type="button" class="btn-action" onclick="syncSavedMessages()"><i class="bi bi-arrow-repeat text-success"></i> ទាញទិន្នន័យ (Sync)</button>
      <span class="ms-auto small text-muted fw-bold" id="itemCountLabel" style="font-family:'Khmer OS Siemreap', sans-serif;">0 ឯកសារ</span>
    </div>

    <div class="content-scroll" onclick="closeAllMenus()">
      <div class="file-grid" id="fileGrid"></div>
    </div>
  </main>

  <div class="toast-status" id="toastBox">
    <div class="spinner-border spinner-border-sm" id="toastSpin"></div>
    <span id="toastMsg">កំពុងដំណើរការ...</span>
  </div>

  <div class="custom-modal-overlay" id="authModal">
    <div class="custom-modal-box">
      <div class="cm-header"><h6 class="m-0 fw-bold" style="font-family:'Khmer OS Siemreap', sans-serif;"><i class="bi bi-telegram text-primary me-2"></i>ភ្ជាប់គណនី Telegram</h6></div>
      <div class="cm-body">
        <div class="mb-2"><label class="small fw-bold mb-1">1. App api_id</label><input type="number" class="cm-input" id="inpApiId"></div>
        <div class="mb-2"><label class="small fw-bold mb-1">2. App api_hash</label><input type="text" class="cm-input" id="inpApiHash"></div>
        <div class="mb-3"><label class="small fw-bold mb-1">3. Phone Number (+855...)</label><input type="text" class="cm-input" id="inpPhone"></div>
        
        <div id="otpStepBox" style="display:none;" class="p-3 rounded border bg-light text-dark mb-3">
          <label class="small fw-bold text-primary mb-2" id="otpPromptLabel">📩 សូមបញ្ចូលលេខកូដ៖</label>
          <div class="d-flex gap-2">
            <input type="text" class="form-control" id="inpDynamicCode" style="font-family:'Times New Roman', sans-serif;">
            <button type="button" class="btn btn-success fw-bold" id="btnSubmitCode">បញ្ជាក់</button>
          </div>
        </div>
        
        <div class="text-end"><button type="button" class="btn btn-primary fw-bold px-4" onclick="startMTProtoLogin()">Login</button></div>
      </div>
    </div>
  </div>

  <div class="custom-modal-overlay" id="previewModal">
    <div class="custom-modal-box modal-xl-box">
      <div class="cm-header">
        <h6 class="m-0 fw-bold text-truncate me-2" id="previewTitle" style="font-family:'Times New Roman', 'Khmer OS Siemreap', sans-serif; max-width:70%;">Preview</h6>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-success btn-sm px-3 fw-bold" id="btnDirectDlPreview"><i class="bi bi-download"></i></button>
          <button type="button" class="btn-close" onclick="closeModal('previewModal')"></button>
        </div>
      </div>
      <div id="previewBody"></div>
    </div>
  </div>

</body>
</html>
